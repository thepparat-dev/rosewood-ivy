                  - { name: en, label: ภาษาอังกฤษ, widget: string, required: false }

          - name: review_images
            label: รูปรีวิวลูกค้า
            label_singular: รูปรีวิว
            widget: list
            collapsed: true
            required: false
            hint: "อัพรูปรีวิว (เช่น แคปแชท LINE/IG หรือรูปลูกค้ารับดอกไม้) ได้ไม่จำกัด ลากเรียงลำดับได้ — ถ้าไม่มีรูปเลย ส่วนรีวิวจะถูกซ่อน"
            fields:
