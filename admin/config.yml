backend:
  name: github
  repo: thepparat-dev/rosewood-ivy
  branch: main
  base_url: https://sveltia-cms-auth.ioinwwaoi.workers.dev

site_url: https://rosethailand.com

media_folder: Image/uploads
public_folder: Image/uploads

collections:
  - name: site
    label: เนื้อหาเว็บไซต์
    files:
      - name: content
        label: รูปภาพและราคา
        file: content.json
        fields:
          - name: hero
            label: รูปหน้าปก (Hero)
            widget: object
