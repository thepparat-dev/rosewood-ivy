backend:
  name: github
  repo: thepparat-dev/rosewood-ivy
  branch: main
  base_url: https://sveltia-cms-auth.ioinwwaoi.workers.dev

site_url: https://thepparat-dev.github.io/rosewood-ivy

media_folder: Image/uploads
public_folder: Image/uploads

collections:
  - name: site
    label: เนื้อหาเว็บไซต์
    files:
      - name: content
        label: รูปภาพและราคา
        file: content.json
        fields:
          - name: hero
            label: รูปหน้าปก (Hero)
            widget: object
            fields:
              - { name: image, label: รูปใหญ่หน้าแรก, widget: image }

          - name: collections
            label: แถบคอลเลกชัน (4 รูป)
            widget: object
            collapsed: true
            fields:
              - name: signature
                label: The Signature Collection
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }
              - name: rose-edit
                label: 01 · The Rose Edit
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }
              - name: gift-edit
                label: 02 · The Curated Gift Edit
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }
              - name: moments
                label: 03 · Bespoke Moments
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }

          - name: products
            label: สินค้า (รูปและราคา)
            widget: object
            collapsed: true
            fields:
              - name: signature-cloud
                label: ช่อคลาวด์ซิกเนเจอร์ (Signature Cloud Bouquet)
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }
                  - { name: price, label: ราคาเริ่มต้น (บาท), widget: number, value_type: int, required: false, hint: "ใส่เฉพาะตัวเลข เช่น 1200 — เว้นว่างถ้าต้องการให้แสดงว่า 'สอบถามราคา'" }
              - name: signature-white
                label: ช่อซิกเนเจอร์ไวท์ (Signature White Bouquet)
                widget: object
                fields:
                  - { name: image, label: รูป, widget: image }
                  - { name: price, label: ราคาเริ่มต้น (บาท), widget: number, value_type: int, required: false, hint: "ใส่เฉพาะตัวเลข เช่น 1500 — เว้นว่างถ้าต้องการให้แสดงว่า 'สอบถามราคา'" }
              - name: dior-inspired
